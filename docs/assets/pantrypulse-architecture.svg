<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">PantryPulse AWS architecture</title>
  <desc id="desc">React client delivered by CloudFront connects through an AWS Blocks API to Cognito, Lambda, DynamoDB, S3, Bedrock Nova, and CloudWatch in us-east-2.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102f27"/>
      <stop offset="1" stop-color="#1b493b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#061a15" flood-opacity=".24"/>
    </filter>
    <marker id="lineArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#e3ad58"/>
    </marker>
  </defs>
  <rect width="1440" height="860" rx="36" fill="url(#canvas)"/>
  <text x="70" y="75" fill="#fff7e8" font-family="Manrope,Arial,sans-serif" font-size="32" font-weight="700">PantryPulse on AWS</text>
  <text x="70" y="112" fill="#bed0c8" font-family="Manrope,Arial,sans-serif" font-size="18">Typed application and infrastructure • regional resources in us-east-2</text>

  <g fill="none" stroke="#e3ad58" stroke-width="4" stroke-linecap="round" marker-end="url(#lineArrow)">
    <path d="M290 243H390"/>
    <path d="M650 243H755"/>
    <path d="M1015 243H1120"/>
    <path d="M885 322V418"/>
    <path d="M885 551V640"/>
    <path d="M950 485H1118"/>
    <path d="M820 485H650"/>
  </g>
  <path d="M520 322V674H442" fill="none" stroke="#8db7a6" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#lineArrow)"/>

  <g filter="url(#soft)">
    <rect x="70" y="165" width="220" height="156" rx="24" fill="#fff7e8"/>
    <circle cx="118" cy="213" r="24" fill="#dce9d3"/>
    <path d="M107 206h22v16h-22zM111 202h14" fill="none" stroke="#1f5b47" stroke-width="4" stroke-linejoin="round"/>
    <text x="105" y="268" fill="#173f33" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="700">React + Vite</text>
    <text x="105" y="296" fill="#647269" font-family="Manrope,Arial,sans-serif" font-size="16">Pantry experience</text>

    <rect x="390" y="165" width="260" height="156" rx="24" fill="#fff7e8"/>
    <circle cx="438" cy="213" r="24" fill="#f5dfb5"/>
    <path d="M425 213h26M438 200v26" stroke="#9b5e1a" stroke-width="4" stroke-linecap="round"/>
    <text x="425" y="268" fill="#173f33" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="700">CloudFront</text>
    <text x="425" y="296" fill="#647269" font-family="Manrope,Arial,sans-serif" font-size="16">Global delivery</text>

    <rect x="755" y="165" width="260" height="156" rx="24" fill="#fff7e8"/>
    <circle cx="803" cy="213" r="24" fill="#dce9d3"/>
    <path d="M791 205h24v17h-24zM797 212h12" fill="none" stroke="#1f5b47" stroke-width="4" stroke-linecap="round"/>
    <text x="790" y="268" fill="#173f33" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="700">AWS Blocks API</text>
    <text x="790" y="296" fill="#647269" font-family="Manrope,Arial,sans-serif" font-size="16">Typed RPC + API Gateway</text>

    <rect x="1120" y="165" width="250" height="156" rx="24" fill="#fff7e8"/>
    <circle cx="1168" cy="213" r="24" fill="#f2d1c4"/>
    <path d="M1157 214h22M1168 203v22" stroke="#a44b32" stroke-width="4" stroke-linecap="round"/>
    <text x="1155" y="268" fill="#173f33" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="700">Cognito</text>
    <text x="1155" y="296" fill="#647269" font-family="Manrope,Arial,sans-serif" font-size="16">Identity and sessions</text>

    <rect x="755" y="418" width="260" height="133" rx="24" fill="#e3ad58"/>
    <circle cx="803" cy="464" r="23" fill="#173f33"/>
    <path d="M795 454h16l-4 10 4 10h-16l4-10z" fill="#fff7e8"/>
    <text x="790" y="509" fill="#173f33" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="800">Lambda</text>
    <text x="790" y="533" fill="#3d4c44" font-family="Manrope,Arial,sans-serif" font-size="15">Domain services + validation</text>

    <rect x="360" y="640" width="290" height="145" rx="24" fill="#fff7e8"/>
    <circle cx="408" cy="688" r="24" fill="#dce9d3"/>
    <ellipse cx="408" cy="680" rx="13" ry="5" fill="none" stroke="#1f5b47" stroke-width="3"/>
    <path d="M395 680v16c0 7 26 7 26 0v-16" fill="none" stroke="#1f5b47" stroke-width="3"/>
    <text x="395" y="742" fill="#173f33" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="700">DynamoDB</text>
    <text x="395" y="767" fill="#647269" font-family="Manrope,Arial,sans-serif" font-size="15">User-partitioned records</text>

    <rect x="740" y="640" width="290" height="145" rx="24" fill="#fff7e8"/>
    <circle cx="788" cy="688" r="24" fill="#f5dfb5"/>
    <path d="M776 680h24v18h-24zM780 676h16" fill="none" stroke="#9b5e1a" stroke-width="3" stroke-linejoin="round"/>
    <text x="775" y="742" fill="#173f33" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="700">Amazon S3</text>
    <text x="775" y="767" fill="#647269" font-family="Manrope,Arial,sans-serif" font-size="15">Private, expiring uploads</text>

    <rect x="1118" y="418" width="252" height="133" rx="24" fill="#fff7e8"/>
    <circle cx="1166" cy="464" r="23" fill="#f2d1c4"/>
    <path d="M1155 467c8-14 18-14 24 0M1167 452v27" fill="none" stroke="#a44b32" stroke-width="3" stroke-linecap="round"/>
    <text x="1153" y="509" fill="#173f33" font-family="Manrope,Arial,sans-serif" font-size="21" font-weight="700">Bedrock Nova</text>
    <text x="1153" y="533" fill="#647269" font-family="Manrope,Arial,sans-serif" font-size="15">Vision + recipe generation</text>
  </g>

  <g>
    <rect x="70" y="650" width="210" height="125" rx="22" fill="#264f42" stroke="#6f9a89" stroke-width="2"/>
    <text x="105" y="701" fill="#fff7e8" font-family="Manrope,Arial,sans-serif" font-size="21" font-weight="700">CloudWatch</text>
    <text x="105" y="732" fill="#bed0c8" font-family="Manrope,Arial,sans-serif" font-size="15">Logs + metrics</text>
  </g>

  <text x="1140" y="805" fill="#bed0c8" font-family="Manrope,Arial,sans-serif" font-size="15">Infrastructure expressed with AWS CDK</text>
</svg>
